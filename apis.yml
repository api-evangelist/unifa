aid: unifa
name: Unifa
description: >-
  Unifa Inc. (ユニファ株式会社) is a Tokyo-based childcare-technology company founded in May 2013 that
  develops and operates Lookmee (ルクミー), a comprehensive ICT, IoT and AI service for Japanese nursery
  schools, kindergartens, certified children's centers, municipality-run facilities and after-school
  clubs. Lookmee bundles class-information management, guidance-plan and daily-log paperwork, a
  parent communication app (Lookmee for FAMILY), internet photo sales, nap-check sensors,
  non-contact thermometers, attendance timestamping, childcare-fee billing and direct debit, shift
  and attendance management, school-bus GPS tracking, and the Care AI "Sukusuku Report"
  growth-visualization product. The company reports more than 20,000 cumulative service
  installations across all 47 prefectures. Unifa publishes no public developer program — no
  developer portal, API reference, OpenAPI/AsyncAPI specification, SDK, CLI or MCP server — and the
  Lookmee product API host answers 403 to every anonymous request.
